<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>

<!-- NAVBAR  -->
<header class="nav">
  <div class="container nav-inner">
    <div class="logo">
      <img src="assets/icons/logo.png" alt="logo">
      <span>NANO GALLERY</span>
    </div>

    <nav class="menu">
      <a href="#hero">Home</a>
      <a href="#categories">Categories</a>
      <a href="#about">About</a>
    </nav>

<div class="nav-right">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search prompts...">
  </div>
</div>
</header>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-overlay">
    <div class="floating-icons">
  <span>✨</span>
  <span>🎨</span>
  <span>🖌️</span>
  <span>💡</span>
  <span>⚡</span>
  <span>✨</span>
  <span>🎨</span>
  <span>🖌️</span>
</div>
    <div class="container hero-content">
      <img src="assets/icons/mainlogo.png" alt="Nano Gallery Logo" class="hero-logo">
      <h1>WELCOME TO <span>NANO GALLERY</span></h1>
      <p><span class="hover-word">Unlocking</span> <span class="hover-word">infinite</span> <span class="hover-word">creativity</span><span class="hover-word"> with</span> <span class="hover-word">AI prompts</span>.</p>
      <a href="#prompts"><button class="cta">EXPLORE PROMPTS</button></a>
    </div>
  </div>
</section>

<!-- CATEGORIES -->
<section class="categories" id="categories">
  <div class="container">
    <h2>CATEGORIES</h2>

    <div class="category-grid">

      <div class="cat-card" data-filter="all">
        <img src="assets/images/all.png" alt="All categories">
        <span>All</span>
      </div>

      <div class="cat-card" data-filter="celebrity">
        <img src="assets/images/image1.jpg" alt="Celebrity category">
        <span>Celebrity</span>
      </div>

      <div class="cat-card" data-filter="fantasy">
        <img src="assets/images/image2.jpg" alt="Fantasy category">
        <span>Fantasy</span>
      </div>

      <div class="cat-card" data-filter="anime">
        <img src="assets/images/image3.jpg" alt="Anime category">
        <span>Anime</span>
      </div>

      <div class="cat-card" data-filter="portrait">
        <img src="assets/images/image4.png" alt="Portrait category">
        <span>Portrait</span>
      </div>

      <div class="cat-card" data-filter="sketch">
        <img src="assets/images/image5.jpg" alt="Sketch category">
        <span>Sketch</span>
      </div>

    </div>
  </div>
</section>

<!-- PROMPTS -->
<section class="prompts" id="prompts">
  <div class="container">
    <h2>TRENDING PROMPTS</h2>
    <div class="prompt-grid" id="promptGrid">
      <p id="noResults">
        No results found 😶
      </p>
    </div>
    <div class="pagination">
      <a class="active" href="index.html">1</a>
      <a href="page2.html">2</a>
      <a href="page3.html">3</a>
    </div>
  </div>
</section>

<!-- CTA -->
<section class="cta-section">
  <div class="container">
    <h2>START CREATING AI IMAGES NOW</h2>
    <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer"><button class="cta">GENERATE WITH GEMINI</button></a>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer" id="about">
  <div class="copyright">
     © 2026 Nano Gallery by Bobby💗
  </div>
</footer>

</body>
</html>
